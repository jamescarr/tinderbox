# Toolchain and tasks for tinderbox. https://mise.jdx.dev
#   mise trust && mise install
#   mise run check        # what CI should run
#
# The Elixir/Erlang pins follow ankusa's. Generated projects pin the toolchain that
# runs the generator instead (Tinderbox.Toolchain); its fallback for dev and
# pre-release builds is the pair this package was last verified with.

[tools]
elixir = "1.20.4-otp-29"
erlang = "29.1"

[tasks.test]
description = "Run the unit tests"
run = "mix test"

[tasks.check]
description = "What CI should run: formatting, warnings-as-errors compile, tests"
run = ["mix format --check-formatted", "mix compile --warnings-as-errors", "mix test"]
